<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
{%- if page.alt_url %}
<link rel="alternate" hreflang="{{ page.lang }}" href="{{ site.url }}{{ page.url }}">
<link rel="alternate" hreflang="{{ page.alt_lang }}" href="{{ site.url }}{{ page.alt_url }}">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.xdefault_url | default: page.url }}">
{%- endif %}
<meta property="og:type" content="{{ page.og_type | default: 'article' }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:locale" content="{{ page.locale | default: 'de_DE' }}">
<meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: site.description | strip_newlines | strip | jsonify }},
  "inLanguage": {{ page.lang | default: site.lang | jsonify }},
  "datePublished": {{ page.date_published | jsonify }},
  "dateModified": {{ page.date_modified | default: page.date_published | jsonify }},
  "author": { "@type": "Person", "name": "Frederik Berg" },
  "license": "https://creativecommons.org/licenses/by/4.0/",
  "mainEntityOfPage": {{ site.url | append: page.url | jsonify }}
}
</script>
<style>
:root{--bg:#fdfdfc;--fg:#1b1b1a;--muted:#5d5d58;--rule:#e2e2dd;--quote-bg:#f5f5f1;--accent:#8a4b16;--link:#1c4f8a}
@media (prefers-color-scheme:dark){:root{--bg:#16181a;--fg:#e6e6e3;--muted:#a0a09a;--rule:#2e3236;--quote-bg:#1e2225;--accent:#d99b5e;--link:#7fb2e8}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:0 16px}
main{max-width:46rem;margin:0 auto;padding:3rem 0 4rem}
h1{font-size:1.9rem;line-height:1.25;margin:0 0 .6rem;letter-spacing:-.01em}
h2{font-size:1.28rem;line-height:1.3;margin:2.6rem 0 .8rem;padding-top:1.4rem;border-top:1px solid var(--rule)}
h3{font-size:1.05rem;margin:1.8rem 0 .5rem}
p{margin:0 0 1.05rem}
a{color:var(--link)}
blockquote{margin:1.1rem 0;padding:.85rem 1.1rem;background:var(--quote-bg);
  border-left:3px solid var(--accent);border-radius:0 4px 4px 0}
blockquote p{margin:0 0 .6rem}
blockquote p:last-child{margin:0}
blockquote cite{display:block;margin-top:.5rem;font-size:.85rem;font-style:normal;color:var(--muted);word-break:break-word}
ul,ol{margin:0 0 1.05rem;padding-left:1.35rem}
li{margin:0 0 .45rem}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;
  background:var(--quote-bg);padding:.1em .35em;border-radius:3px}
.lede{font-size:1.06rem}
.nav{font-size:.85rem;margin:0 0 1.6rem}
.nav a{color:var(--muted);text-decoration:none}
.nav a:hover{text-decoration:underline}
.meta{font-size:.85rem;color:var(--muted);margin:0 0 2.2rem;padding-bottom:1.4rem;border-bottom:1px solid var(--rule)}
.entry{margin:0 0 2rem}
.entry h2{font-size:1.15rem;margin:0 0 .35rem;padding:0;border:0}
.entry .sub{font-size:.85rem;color:var(--muted);margin:0 0 .4rem}
.meta a{color:var(--muted)}
.colophon{margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--rule);font-size:.85rem;color:var(--muted)}
.colophon a{color:var(--muted)}
@media (max-width:480px){body{font-size:16px}h1{font-size:1.55rem}main{padding:2rem 0 3rem}}
</style>
</head>
<body>
<main>
{%- unless page.is_index %}
<p class="nav"><a href="/">{{ site.title }}</a></p>
{%- endunless %}
<h1>{{ page.title }}</h1>
{%- if page.meta_line %}
<p class="meta">{{ page.meta_line }}</p>
{%- endif %}
{{ content }}
</main>
</body>
</html>
